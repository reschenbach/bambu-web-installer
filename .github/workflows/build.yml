name: Build and publish browser installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'dashboard.html'
      - 'platformio.ini'
      - 'embed_dashboard.py'
      - 'site/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and esptool
        run: python -m pip install platformio esptool==4.8.1
      - name: Compile firmware
        run: pio run -e seeed_xiao_esp32c3
      - name: Create single browser-flashable image
        run: |
          python -m esptool --chip esp32c3 merge_bin -o site/firmware-merged.bin --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 .pio/build/seeed_xiao_esp32c3/bootloader.bin \
            0x8000 .pio/build/seeed_xiao_esp32c3/partitions.bin \
            0x10000 .pio/build/seeed_xiao_esp32c3/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: bambu-c3-flash-image
          path: site/firmware-merged.bin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - run: echo "Installer URL ${{ steps.deployment.outputs.page_url }}"
